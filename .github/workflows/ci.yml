# Runs every module's unit tests, builds it for wasm32-unknown-unknown, and checks the built
# file against the Neblex contract (no imports; memory, alloc and invoke exported; the sample
# input returns valid JSON). Runs on every push to main and on every pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust and the wasm32 target
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add wasm32-unknown-unknown

      - name: Unit tests and builds
        run: |
          # Build from /repo, the path ./build.sh uses. Cargo hashes the absolute path of the patched
          # crates in vendor/ into the build, so building from another path gives different bytes.
          sudo mkdir -p /repo && sudo mount --bind "$GITHUB_WORKSPACE" /repo && cd /repo
          # ahash (used by the parquet crate) bakes a random seed into each build unless this is set.
          export CONST_RANDOM_SEED=neblex-wasm-modules
          mkdir -p dist
          for m in */; do
            m=${m%/}
            [ -f "$m/Cargo.toml" ] || continue
            echo "::group::$m"
            (cd "$m" && cargo test --lib --locked && RUSTFLAGS="--remap-path-prefix=${CARGO_HOME:-$HOME/.cargo}=/cargo --remap-path-prefix=$(dirname "$PWD")=/repo --remap-path-prefix=$PWD=/build" cargo build --release --locked --target wasm32-unknown-unknown --lib)
            cp "$m"/target/wasm32-unknown-unknown/release/*.wasm "dist/$m.wasm"
            echo "::endgroup::"
          done

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Checksums
        run: cd dist && sha256sum *.wasm

      - name: Contract check
        run: |
          pip install --quiet wasmtime
          python -I test/contract.py dist
